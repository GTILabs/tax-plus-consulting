name: Deploy to Vercel

# main → Preview build aliased to dev.taxplus-consulting.co.id
# vX.Y.Z tag (or a GitHub Release) → Production build aliased to www.taxplus-consulting.co.id
# (the apex redirects to www in the Vercel domain settings).
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: deploy-${{ github.ref_type }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

jobs:
  dev:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.taxplus-consulting.co.id
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - run: vercel build --token="$VERCEL_TOKEN"
      - name: Deploy and alias to dev
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          vercel alias set "$url" dev.taxplus-consulting.co.id --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

  production:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://taxplus-consulting.co.id
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag must point at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      # --skip-domain keeps dev.taxplus-consulting.co.id (also a project domain) on the main build.
      - name: Deploy and alias to production
        run: |
          url=$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")
          vercel alias set "$url" www.taxplus-consulting.co.id --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
